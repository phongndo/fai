[package]
name = "fai-target-aarch64"
version = "0.1.0"
description = "FIR's AArch64 backend: instruction selection to the aarch64 LFIR dialect, register allocation and its check, GNU assembly"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fai-codegen = { path = "../../compiler/codegen" }
fai-interp = { path = "../../compiler/interp" }
fai-ir = { path = "../../compiler/ir" }
num-bigint = "0.4"
rustc-hash = "2"

# The examples in the docs are written against the supported interface, the `fir` crate.
[dev-dependencies]
fir = { path = "../../sdk/rust" }

[lints]
workspace = true
