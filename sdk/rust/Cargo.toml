[package]
name = "fir"
version = "0.1.0"
description = "FIR: the compiler IR, checked against the Lean semantics in spec/"
edition.workspace = true
license.workspace = true
# The package's other targets live where the repository keeps them: the `fir` command in
# tools/fir, the cross-component test suites in tests/rust (with the .fir corpora they read),
# and the timing examples in benchmarks/rust. They stay targets of this package so
# `cargo test -p fir --test NAME`, `cargo run --bin fir`, and `cargo run --example NAME` keep
# working, and so the suites can run the binary (CARGO_BIN_EXE_fir is only given to tests of
# the package that builds it).
autobins = false
autoexamples = false
autotests = false

[dependencies]
fai-codegen = { path = "../../compiler/codegen" }
fai-driver = { path = "../../compiler/driver" }
fai-interp = { path = "../../compiler/interp" }
fai-ir = { path = "../../compiler/ir" }
fai-lowering = { path = "../../compiler/lowering" }
fai-target-aarch64 = { path = "../../targets/aarch64" }
fai-target-x86_64 = { path = "../../targets/x86_64" }
fai-transforms = { path = "../../compiler/transforms" }

[dev-dependencies]
num-bigint = "0.4"

[lints]
workspace = true

[[bin]]
name = "fir"
path = "../../tools/fir/main.rs"

