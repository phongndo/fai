# cbindgen settings for include/fir.h; sdk/c/tests/generated.rs regenerates the header
# and fails if the checked-in one differs.
language = "C"
cpp_compat = true
include_guard = "FIR_H"
usize_is_size_t = true
documentation = true
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
header = """
/* FIR's C API: build, verify, print, and run FIR modules. See sdk/c/src/lib.rs for
 * the rules (handles and ids, errors, ownership, stability). */"""
autogen_warning = """
/* Generated by cbindgen from sdk/c. Do not edit: regenerate with
 * `cbindgen --config sdk/c/cbindgen.toml --crate fir-capi --output sdk/c/include/fir.h`. */"""

[export]
# The opaque handles.
include = ["FirModule", "FirBuilder"]

[parse]
parse_deps = false
