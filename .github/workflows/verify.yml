# The required checks, on two native hosts:
#
# * x86-64 Linux (ubuntu-24.04): the dev shell builds (`nix flake check`), and the full
#   verification passes (`fai verify full`: Lean from scratch, generated files, the proof
#   audit, formatting and lints, every Rust suite in debug and release with the Lean reference
#   and qemu required, the C API under AddressSanitizer, and the evidence that the work ran).
#   x86-64 code runs natively here; AArch64 Linux code runs under qemu-user.
# * Apple-silicon macOS (macos-15, arm64): the same command, natively. AArch64 code runs natively
#   as Mach-O. What macOS can't run by construction (x86-64 and AArch64 Linux binaries, the
#   Linux ABI torture test, fcc's corpus, the C API's Linux native half) is declared in
#   `HOST_GAPS` (tools/fai/src/main.rs); the run must report host verification with exactly those
#   gaps unverified, and never reports full verification.
#
# A third job, on x86-64 Linux, says whether the change is accepted (`fai accept`): the full
# verification again, then the gate (`fai gate`: Lua and SQLite fetched, built, checked, and no
# worse than the accepted baseline), then, when the change edits tests that existed at the
# base, those tests as they were against the changed code. It is a job of its own because it
# needs the network, which `fai verify full` doesn't. It exits 0 for a pass and 3 for a pass
# that changed files that judge it (a baseline, a checker, a test whose old version the change
# fails): both pass the job, and its summary names the files, since merging is the owner's yes.
# 1 (failed) and 2 (a part could not run) fail it. The change is compared with the branch a
# pull request is for, or with what `main` was before a push.
#
# Each host's report is uploaded whether it passes or not, and the last job puts both side by
# side (`fai matrix`, run as `cargo fai matrix`) in the run's summary: what ran natively, under an emulator, or not
# at all.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: x86_64-linux
            # The verdict this host must reach (report.json).
            require: full_verification
          - runner: macos-15
            host: aarch64-macos
            require: host_verification
    name: verify (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Dev shell builds
        run: nix flake check
      - name: Verification
        run: nix develop -c fai verify full
      - name: Required verdict
        run: |
          nix develop -c uv run python - <<'EOF'
          import json, sys
          r = json.load(open("target/verify/report.json"))
          want = "${{ matrix.require }}"
          print(r["verdict"])
          if r.get("host") != "${{ matrix.host }}":
              sys.exit(f"report is for {r.get('host')}, not ${{ matrix.host }}")
          if r.get(want) is not True:
              sys.exit(f"{want} is not true")
          if want == "full_verification" and r.get("unverified_on_this_host"):
              sys.exit("a host that must verify fully declares host gaps")
          EOF
      - name: Summary
        if: always()
        run: cat target/verify/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ matrix.host }}
          path: |
            target/verify/report.json
            target/verify/report.md
            target/verify/proofs.md

  accept:
    name: accept (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The judging files are compared with a base, which needs the history.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Acceptance
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          set +e
          # A push that creates the branch has no commit before it: the commit before this one.
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE=HEAD^; fi
          nix develop -c fai accept --base "$BASE"
          code=$?
          echo "fai accept exited with $code"
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]
      - name: Summary
        if: always()
        shell: bash
        run: |
          nix develop -c uv run python - >> "$GITHUB_STEP_SUMMARY" <<'EOF' || true
          import json
          r = json.load(open("target/accept/report.json"))
          print("# " + r["verdict"], "", *("    " + n for n in r["notes"]), "", sep="\n")
          for f in r["judging"].get("files", []):
              print(f"- `{f['status']} {f['path']}` ({f['kind']})")
          EOF
      - name: Upload the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-report
          path: |
            target/accept/report.json
            target/projbench/gate-report.json

  matrix:
    name: what each host verified
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verify-report-*
          path: reports
      - name: Cross-host matrix
        # Only `fai` (tools/fai) and serde_json build: the runner's own Rust is enough, through
        # the checkout's `cargo fai` alias. `shell: bash` sets
        # pipefail, so a failing `fai matrix` fails the step despite `tee`.
        shell: bash
        run: |
          shopt -s nullglob
          files=(reports/*/report.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no reports" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          cargo fai matrix "${files[@]}" | tee matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-matrix
          path: matrix.md
