[alias]
# `cargo fai verify [fast|full]`, `cargo fai experiment …`: the `fai` command (tools/fai), built
# and run from this checkout. In the dev shell, `fai …` does the same.
fai = "run --quiet --package fai-tools --bin fai --"
# The command's old name, kept so existing scripts and branches keep working: the same binary.
xtask = "run --quiet --package fai-tools --bin fai --"
